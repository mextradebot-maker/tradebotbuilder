<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Cerebro Master Trader · MexTradeBot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --mt-accent: #32c7df; --mt-muted: #a6b6cc; }
  body { font-family: 'Lexend', sans-serif; background: #080f1b; color: #edf3fb; }
  .mtb-btn { transition: transform 160ms ease-out; }
  .mtb-btn:active { transform: scale(0.97); }
  .ag-eyebrow { font-size: 10px; letter-spacing: 1.8px; color: var(--mt-accent); }
  .ag-muted { color: var(--mt-muted); }
</style>
</head>
<body class="min-h-screen">
<main class="max-w-6xl mx-auto px-4 py-8">
  <div id="page-master"></div>
  <section id="mtbOperacion" class="mt-8"></section>
</main>
<script>
/* Cerebro Master Trader — panel de licencias conectado a /api/v1/licencias (api/licencias.py).
   Toda accion exige la clave de administrador (MTB_ADMIN_KEY), guardada solo en esta pestana. */
window.mtbMaster = { estado: null, filtro: 'all' };

/* Catálogo que acepta el compilador. Copia de compilador.SIMBOLOS / TF_POR_TEMPORALIDAD:
   api.licencias.demo() falla si estas listas se separan de las del servidor. */
var MTB_SIMBOLOS = [
  'EURUSD', 'GBPUSD', 'USDJPY', 'AUDUSD', 'USDCAD', 'USDCHF', 'NZDUSD',
  'XAUUSD', 'XAGUSD', 'EURGBP', 'EURJPY', 'GBPJPY', 'AUDJPY', 'EURAUD',
  'AUDCAD', 'NZDJPY', 'CADJPY', 'US30', 'US100', 'US500', 'GER40', 'UK100',
  'JP225', 'XPTUSD', 'XPDUSD', 'WTIUSD', 'BRENTUSD', 'BTCUSD', 'ETHUSD',
  'XRPUSD', 'GOOGL', 'NVDA', 'META', 'WMT'
];
var MTB_TEMPORALIDADES = [
  'Scalping 15m', 'Scalping 30m', 'Intraday 1H', 'Intraday 4H', 'Intraday D', 'Swing (S)', 'Swing (M)'
];

function mtbEsc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function mtbAdminKey(nueva) {
  try {
    if (nueva !== undefined) { if (nueva) sessionStorage.setItem('mtbAdminKey', nueva); else sessionStorage.removeItem('mtbAdminKey'); }
    return sessionStorage.getItem('mtbAdminKey') || '';
  } catch (e) { if (nueva) window.__mtbAdminKey = nueva; return window.__mtbAdminKey || ''; }
}
function mtbApiLicencias(metodo, cuerpo) {
  return fetch('/api/v1/licencias', {
    method: metodo,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': mtbAdminKey() },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined
  }).then(function(r) {
    return r.json().catch(function() { return {}; }).then(function(j) {
      if (r.status === 401) { mtbAdminKey(''); }
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}
function mtbFecha(v) {
  if (!v) return '—';
  var d = new Date(String(v).replace(' ', 'T'));
  return isNaN(d) ? mtbEsc(v) : d.toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });
}
function mtbEstadoLicencia(l) {
  if (l.revocada_en) return 'revocada';
  if (l.expira_en && new Date(String(l.expira_en).replace(' ', 'T')) <= new Date()) return 'expirada';
  return 'activa';
}

window.renderMasterTraderPanel = function() {
  var container = document.getElementById('page-master');
  if (!container) return;
  if (!mtbAdminKey()) { mtbRenderLogin(container); return; }
  container.innerHTML = '<div class="text-slate-400 text-sm">Cargando licencias...</div>';
  mtbApiLicencias('GET').then(function(estado) {
    window.mtbMaster.estado = estado;
    mtbRenderPanel(container);
    mtbCargarOperacion();
  }).catch(function(e) {
    if (!mtbAdminKey()) { mtbRenderLogin(container, e.message); return; }
    container.innerHTML = '<div class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm">No se pudo cargar el Cerebro Master Trader: ' + mtbEsc(e.message) +
      '</div><button type="button" class="mtb-btn mt-3 text-xs px-3 py-2 rounded-lg bg-slate-800 text-slate-200" onclick="renderMasterTraderPanel()">Reintentar</button>';
  });
};

function mtbRenderLogin(container, error) {
  var op = document.getElementById('mtbOperacion'); if (op) op.innerHTML = '';
  container.innerHTML = [
    '<div class="max-w-sm mx-auto mt-8 p-6 rounded-2xl bg-slate-900/90 border border-slate-800">',
      '<span class="ag-eyebrow">ACCESO RESTRINGIDO</span>',
      '<h3 class="text-lg font-extrabold text-white mt-1">Cerebro Master Trader</h3>',
      '<p class="text-xs text-slate-400 mt-1 mb-4">Emitir, revocar licencias y el kill switch requieren la clave de administrador.</p>',
      '<form id="mtbKeyForm" class="space-y-3">',
        '<input id="mtbKeyInput" type="password" required autocomplete="off" placeholder="Clave de administrador" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-sky-500">',
        error ? '<p class="text-xs text-rose-400">' + mtbEsc(error) + '</p>' : '',
        '<button type="submit" class="mtb-btn w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs">Entrar</button>',
      '</form>',
    '</div>'
  ].join('');
  document.getElementById('mtbKeyForm').addEventListener('submit', function(e) {
    e.preventDefault();
    mtbAdminKey(document.getElementById('mtbKeyInput').value.trim());
    window.renderMasterTraderPanel();
  });
}

function mtbRenderPanel(container) {
  var est = window.mtbMaster.estado;
  var lics = est.licencias || [];
  var ks = est.kill_switch || { activo: false };
  var cuenta = function(f) { return lics.filter(f).length; };
  var activas = cuenta(function(l) { return mtbEstadoLicencia(l) === 'activa'; });
  var bloqueadas = lics.length - activas;
  var hace24 = Date.now() - 864e5;
  var conectadas = cuenta(function(l) { return l.ultimo_contacto && new Date(String(l.ultimo_contacto).replace(' ', 'T')).getTime() > hace24; });
  var rechazos = (est.eventos || []).filter(function(e) { return e.resultado === 'rechazado'; }).length;

  var tarjeta = function(titulo, valor, pie, color) {
    return '<div class="p-4 rounded-2xl bg-slate-900/90 border border-slate-800/80 shadow-md">' +
      '<div class="text-slate-400 text-xs mb-2">' + titulo + '</div>' +
      '<div class="text-xl font-extrabold ' + (color || 'text-white') + '">' + valor + '</div>' +
      '<p class="text-[11px] text-slate-400 mt-1">' + pie + '</p></div>';
  };

  container.innerHTML = [
    '<div class="mb-6 flex flex-wrap items-center justify-between gap-4">',

        '</div>',

      '</div>',
      '<div class="flex items-center gap-3">',
        '<button id="btnEmitirLicencia" type="button" class="mtb-btn text-xs font-bold px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white shadow-lg shadow-sky-600/20 transition">Emitir nuevo token</button>',
        '<button id="btnKillSwitch" type="button" class="mtb-btn text-xs font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 transition ' +
          (ks.activo ? 'bg-rose-600 text-white border border-rose-400' : 'bg-slate-800 hover:bg-rose-950/60 text-slate-300 hover:text-rose-300 border border-slate-700 hover:border-rose-500/50') + '">',
          '<span class="w-2.5 h-2.5 rounded-full ' + (ks.activo ? 'bg-white' : 'bg-emerald-500') + '"></span>',
          '<span>' + (ks.activo ? 'KILL SWITCH GLOBAL: ACTIVADO' : 'KILL SWITCH GLOBAL: INACTIVO') + '</span>',

        '<button id="btnSalirMaster" type="button" class="mtb-btn text-[11px] text-slate-400 underline">Salir</button>',
      '</div>',
    '</div>',

    ks.activo ? '<div class="mb-6 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/40 text-rose-200 text-xs"><strong>Kill switch activo</strong> desde ' + mtbFecha(ks.cambiado_en) +
      (ks.motivo ? ' — ' + mtbEsc(ks.motivo) : '') + '. Ningún bot recibe autorización para abrir operaciones; el coordinador del VPS solo gestiona cierres.</div>' : '',

    '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">',
      tarjeta('Licencias emitidas', lics.length, cuenta(function(l) { return l.tipo === 'real'; }) + ' reales · ' + cuenta(function(l) { return l.tipo === 'demo'; }) + ' demo · ' + cuenta(function(l) { return l.tipo === 'vip'; }) + ' VIP'),
      tarjeta('Activas', activas, bloqueadas + ' revocadas o expiradas', 'text-emerald-400'),
      tarjeta('Bots conectados (24 h)', conectadas, 'con contacto al cerebro en el último día'),
      tarjeta('Rechazos recientes', rechazos, 'en los últimos ' + (est.eventos || []).length + ' eventos', rechazos ? 'text-rose-400' : 'text-white'),
    '</div>',

    '<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">',
      '<div class="lg:col-span-2 p-5 rounded-2xl bg-slate-900/90 border border-slate-800/80">',
        '<div class="flex flex-wrap items-center justify-between gap-3 mb-4">',
          '<h3 class="text-sm font-bold text-white">Nodos de bots con licencia</h3>',
          '<div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">',
            ['all:Todos', 'real:Reales', 'demo:Demo', 'vip:VIP', 'bloqueadas:Bloqueadas'].map(function(par) {
              var k = par.split(':');
              return '<button type="button" data-node-filter="' + k[0] + '" class="node-filter-btn px-3 py-1 rounded-lg transition ' +
                (window.mtbMaster.filtro === k[0] ? 'bg-sky-600 text-white font-bold' : 'text-slate-400 hover:text-white') + '">' + k[1] + '</button>';
            }).join(''),
          '</div>',
        '</div>',
        '<div class="overflow-x-auto rounded-xl border border-slate-800">',
          '<table class="w-full text-left text-xs text-slate-300">',

              '<th class="p-3">Cliente / Token</th><th class="p-3">Cuenta</th><th class="p-3">Robot</th><th class="p-3">Estado</th><th class="p-3">Último contacto</th><th class="p-3 text-right">Acción</th>',

    '</div>',

        '<button id="btnCloseModalLicencia" type="button" aria-label="Cerrar" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold">✕</button>',

        '<h3 class="text-lg font-extrabold text-white">Token de bot</h3>',

          '<div class="grid grid-cols-2 gap-3">',
            '<div><label class="block text-slate-300 font-medium mb-1" for="licCuenta">Número de cuenta MT5 (opcional)</label>',
              '<input type="text" inputmode="numeric" pattern="[0-9]+" id="licCuenta" placeholder="Vacío = se amarra al primer uso" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-sky-500"></div>',
            '<div><label class="block text-slate-300 font-medium mb-1" for="licTipo">Tipo de licencia</label>',
              '<select id="licTipo" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200">',
                '<option value="demo">DEMO — solo cuentas demo</option><option value="real">REAL PRO — solo cuenta real</option><option value="vip">VIP — cualquier robot</option>',
              '</select></div>',
          '</div>',
          '<div class="grid grid-cols-2 gap-3">',
            '<div><label class="block text-slate-300 font-medium mb-1" for="licBot">Robot</label>',
              '<select id="licBot" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200">',
                '<option value="seguidor-smc">Seguidor SMC (MexTradeBot_SeguidorSMC)</option>',
              '</select></div>',
            '<div><label class="block text-slate-300 font-medium mb-1" for="licVenc">Vigencia</label>',
              '<select id="licVenc" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200">',
                '<option value="30">30 días</option><option value="90">90 días</option><option value="365">1 año</option><option value="">Ilimitada</option>',
              '</select></div>',
          '</div>',
          '<p id="licError" class="text-rose-400 hidden"></p>',
          '<button type="submit" id="licSubmit" class="mtb-btn w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs">Generar token</button>',
        '</form>',
        '<div id="licenciaResultado" class="mt-4 hidden p-3 rounded-xl bg-slate-950 border border-emerald-500/30 text-xs">',
          '<p class="text-emerald-400 font-bold mb-1">Token generado. Cópialo ahora: no se puede volver a mostrar.</p>',
          '<div class="flex gap-2 items-center"><code id="generatedTokenCode" class="flex-1 p-2 rounded bg-slate-900 font-mono text-[12px] text-sky-300 select-all break-all"></code>',
          '<button type="button" id="btnCopiarToken" class="mtb-btn px-3 py-2 rounded-lg bg-slate-800 text-slate-200 text-[11px]">Copiar</button></div>',
          '<p class="text-[11px] text-slate-400 mt-2">El cliente lo pega en el parámetro <span class="font-mono">MTB_LICENSE_TOKEN</span> del robot en MetaTrader 5.</p>',
        '</div>',
      '</div>',
    '</div>'
  ].join('');

  mtbRenderTabla();
  mtbRenderFeed();
  mtbBindEventos();
}

function mtbRenderTabla() {
  var tbody = document.getElementById('nodeTableBody');
  if (!tbody) return;
  var f = window.mtbMaster.filtro;
  var lics = (window.mtbMaster.estado.licencias || []).filter(function(l) {
    if (f === 'bloqueadas') return mtbEstadoLicencia(l) !== 'activa';
    return f === 'all' || l.tipo === f;
  });
  if (!lics.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500">' +
      (f === 'all' ? 'Aún no hay licencias emitidas. Usa “Emitir nuevo token”.' : 'Ninguna licencia coincide con el filtro.') + '</td></tr>';
    return;
  }
  tbody.innerHTML = lics.map(function(l) {
    var est = mtbEstadoLicencia(l);
    var badge = est === 'activa'
      ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Activa</span>'
      : '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">' + (est === 'revocada' ? 'Revocada' : 'Expirada') + '</span>';
    var ultimo = l.ultimo_resultado && l.ultimo_resultado !== 'ok'
      ? '<div class="text-[10px] text-rose-400">' + mtbEsc(l.ultimo_resultado) + '</div>' : '';
    var accion = est === 'activa'
      ? '<button type="button" class="mtb-btn text-[11px] bg-sky-900/60 hover:bg-sky-800 text-sky-200 border border-sky-700/60 px-2.5 py-1 rounded-lg mr-1" data-robot="' + l.id + '" title="Descargar .ex5 con el token de esta licencia, ya configurado con el par y la temporalidad">Robot</button>' + (l.cuenta ? '<button type="button" class="mtb-btn text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1 rounded-lg mr-1" data-liberar="' + l.id + '">Liberar cuenta</button>' : '') + '<button type="button" class="mtb-btn text-[11px] bg-slate-800 hover:bg-rose-900/60 text-slate-300 hover:text-rose-200 border border-slate-700 px-2.5 py-1 rounded-lg" data-revocar="' + l.id + '">Revocar</button>'
      : '<button type="button" class="mtb-btn text-[11px] bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-lg" data-reautorizar="' + l.id + '" data-expirada="' + (est === 'expirada') + '">' + (est === 'expirada' ? 'Renovar' : 'Reautorizar') + '</button>';
    return '<tr class="hover:bg-slate-800/40">' +
      '<td class="p-3"><div class="font-bold text-white">' + mtbEsc(l.cliente) + '</div><div class="text-[11px] text-slate-400 font-mono">' + mtbEsc(l.token_prefijo) + '…</div></td>' +
      '<td class="p-3"><div class="font-mono">' + (l.cuenta ? mtbEsc(l.cuenta) : '<span class="text-amber-300">sin amarrar</span>') + '</div><div class="text-[11px] text-slate-400 uppercase">' + mtbEsc(l.tipo) + '</div></td>' +
      '<td class="p-3 font-mono">' + (l.robot === '*' ? 'Todos (VIP)' : mtbEsc(l.robot)) + '</td>' +
      '<td class="p-3">' + badge + '<div class="text-[10px] text-slate-500 mt-1">vence ' + (l.expira_en ? mtbFecha(l.expira_en) : 'nunca') + '</div></td>' +
      '<td class="p-3 font-mono text-slate-400">' + mtbFecha(l.ultimo_contacto) + ultimo + '</td>' +
      '<td class="p-3 text-right">' + accion + '</td></tr>';
  }).join('');
}

function mtbRenderFeed() {
  var feed = document.getElementById('masterTerminalFeed');
  if (!feed) return;
  var ev = window.mtbMaster.estado.eventos || [];
  feed.innerHTML = ev.length ? ev.map(function(e) {
    var color = e.resultado === 'rechazado' ? 'text-rose-400' : 'text-sky-300';
    return '<div class="' + color + '">[' + mtbFecha(e.registrado_en) + '] ' + mtbEsc(e.resultado.toUpperCase()) + ' · ' + mtbEsc(e.motivo) +
      (e.cliente ? ' · ' + mtbEsc(e.cliente) : '') + (e.cuenta ? ' · #' + mtbEsc(e.cuenta) : '') + (e.ip ? ' · ' + mtbEsc(e.ip) : '') + '</div>';
  }).join('') : '<div class="text-slate-500">Sin eventos todavía.</div>';
}

function mtbAccion(cuerpo) {
  return mtbApiLicencias('POST', cuerpo).then(function() { window.renderMasterTraderPanel(); })
    .catch(function(e) { alert('No se pudo completar: ' + e.message); });
}

/* Descarga del .ex5 ya configurado. El nombre lo decide el servidor (X-MTB-Nombre):
   MTB_<cuenta>_<SIMBOLO>_<temporalidad>.ex5, para que en el Navegador de MT5 se vea a qué
   terminal y a qué par pertenece cada robot y no se vuelvan a cruzar dos descargas. */
function mtbDescargarRobot(boton, id, simbolo, temporalidad) {
  var url = '/api/v1/licencias/robot?id=' + encodeURIComponent(id);
  if (simbolo && temporalidad) {
    url += '&simbolo=' + encodeURIComponent(simbolo) + '&temporalidad=' + encodeURIComponent(temporalidad);
  }
  var texto = boton.textContent; boton.disabled = true; boton.textContent = 'Compilando…';
  var nombre = 'MexTradeBot_SeguidorSMC.ex5';
  return fetch(url, { headers: { 'X-Admin-Key': mtbAdminKey() } })
    .then(function(r) {
      if (!r.ok) return r.json().catch(function() { return {}; }).then(function(j) {
        if (j.error === 'generador_actualizando') {
          throw new Error('El generador del VPS todavía no sabe grabar el símbolo y la temporalidad en el robot. ' +
            'Actualiza el VPS (git pull + reiniciar MTB-ServidorLocal) o descarga el robot sin configurar y ponle el par a mano.');
        }
        throw new Error(j.error || ('HTTP ' + r.status));
      });
      nombre = r.headers.get('X-MTB-Nombre') || nombre;
      return r.blob();
    })
    .then(function(blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function() { URL.revokeObjectURL(a.href); }, 5000);
    })
    .catch(function(e) { alert('No se pudo generar el robot: ' + e.message); })
    .then(function() { boton.disabled = false; boton.textContent = texto; });
}

/* Antes de compilar se elige par y temporalidad: el robot sale listo para arrastrar al gráfico
   (el capital se queda en 0 = balance real de la cuenta). "Sin configurar" deja el flujo de antes. */
function mtbElegirRobot(boton) {
  var id = boton.dataset.robot;
  var lic = (window.mtbMaster.estado.licencias || []).filter(function(l) { return String(l.id) === String(id); })[0] || {};
  var ops = function(lista) {
    return lista.map(function(v) { return '<option value="' + mtbEsc(v) + '">' + mtbEsc(v) + '</option>'; }).join('');
  };
  var fondo = document.createElement('div');
  fondo.className = 'fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4';
  fondo.innerHTML = '<div class="w-full max-w-sm p-5 rounded-2xl bg-slate-900 border border-slate-800 text-sm">' +
    '<p class="font-bold text-white mb-1">Robot listo para arrastrar</p>' +
    '<p class="text-[11px] text-slate-400 mb-4">' + mtbEsc(lic.cliente || '') +
      (lic.cuenta ? ' · cuenta <span class="font-mono">' + mtbEsc(lic.cuenta) + '</span>' : ' · cuenta sin amarrar') + '</p>' +
    '<label class="block text-slate-300 font-medium mb-1" for="robotSimbolo">Par</label>' +
    '<select id="robotSimbolo" class="w-full mb-3 px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200">' + ops(MTB_SIMBOLOS) + '</select>' +
    '<label class="block text-slate-300 font-medium mb-1" for="robotTemporalidad">Temporalidad</label>' +
    '<select id="robotTemporalidad" class="w-full mb-4 px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200">' +
      '<option value="">— elige la temporalidad —</option>' + ops(MTB_TEMPORALIDADES) + '</select>' +
    '<button type="button" id="robotOk" class="mtb-btn w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs">Compilar y descargar</button>' +
    '<div class="flex justify-between mt-3 text-[11px]">' +
      '<button type="button" id="robotSin" class="text-slate-400 hover:text-slate-200 underline">Descargar sin configurar</button>' +
      '<button type="button" id="robotCancelar" class="text-slate-400 hover:text-slate-200">Cancelar</button>' +
    '</div></div>';
  document.body.appendChild(fondo);
  fondo.querySelector('#robotSimbolo').value = 'XAUUSD';
  var cerrar = function() { fondo.remove(); };
  fondo.addEventListener('click', function(e) { if (e.target === fondo) cerrar(); });
  fondo.querySelector('#robotCancelar').addEventListener('click', cerrar);
  fondo.querySelector('#robotSin').addEventListener('click', function() { cerrar(); mtbDescargarRobot(boton, id); });
  fondo.querySelector('#robotOk').addEventListener('click', function() {
    var s = fondo.querySelector('#robotSimbolo').value, t = fondo.querySelector('#robotTemporalidad').value;
    if (!t) { alert('Elige la temporalidad con la que va a operar este robot.'); return; }
    cerrar();
    mtbDescargarRobot(boton, id, s, t);
  });
}

function mtbBindEventos() {
  document.querySelectorAll('.node-filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { window.mtbMaster.filtro = btn.dataset.nodeFilter; mtbRenderPanel(document.getElementById('page-master')); });
  });
  document.getElementById('nodeTableBody').addEventListener('click', function(e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.robot) { mtbElegirRobot(b); }
    if (b.dataset.liberar && confirm('¿Liberar la cuenta? El próximo robot que se conecte con este token quedará amarrado a su cuenta.')) {
      mtbAccion({ accion: 'liberar', id: Number(b.dataset.liberar) });
    }
    if (b.dataset.revocar && confirm('¿Revocar esta licencia? El bot quedará en STANDBY LOCK en su siguiente consulta y cancelará sus órdenes pendientes.')) {
      mtbAccion({ accion: 'revocar', id: Number(b.dataset.revocar) });
    }
    if (b.dataset.reautorizar) {
      var dias = null;
      if (b.dataset.expirada === 'true') {
        dias = prompt('La licencia expiró. ¿Cuántos días de vigencia nueva? (30, 90, 365)', '30');
        if (dias === null) return;
        dias = parseInt(dias, 10);
        if (!(dias > 0)) { alert('Número de días inválido'); return; }
      }
      mtbAccion({ accion: 'reautorizar', id: Number(b.dataset.reautorizar), vigencia_dias: dias });
    }
  });

  var ks = (window.mtbMaster.estado.kill_switch || {}).activo;
  document.getElementById('btnKillSwitch').addEventListener('click', function() {
    if (ks) {
      if (confirm('¿Desactivar el kill switch y reanudar la autorización de operaciones?')) mtbAccion({ accion: 'kill_switch', activo: false });
    } else {
      var motivo = prompt('KILL SWITCH GLOBAL: bloquea la apertura de operaciones en TODOS los bots y en el coordinador del VPS.\nEscribe el motivo para confirmar:');
      if (motivo && motivo.trim()) mtbAccion({ accion: 'kill_switch', activo: true, motivo: motivo.trim() });
    }
  });
  document.getElementById('btnSalirMaster').addEventListener('click', function() { mtbAdminKey(''); window.renderMasterTraderPanel(); });

  var modal = document.getElementById('modalLicenciaMaster');
  var abrir = function(si) { modal.classList.toggle('hidden', !si); modal.classList.toggle('flex', si); };
  document.getElementById('btnEmitirLicencia').addEventListener('click', function() { abrir(true); });
  document.getElementById('btnCloseModalLicencia').addEventListener('click', function() {
    abrir(false);
    if (!document.getElementById('licenciaResultado').classList.contains('hidden')) window.renderMasterTraderPanel();
  });
  document.getElementById('btnCopiarToken').addEventListener('click', function() {
    var t = document.getElementById('generatedTokenCode').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function() { document.getElementById('btnCopiarToken').textContent = 'Copiado'; });
  });
  document.getElementById('formNuevaLicencia').addEventListener('submit', function(e) {
    e.preventDefault();
    var err = document.getElementById('licError');
    var btn = document.getElementById('licSubmit');
    err.classList.add('hidden');
    btn.disabled = true;
    var venc = document.getElementById('licVenc').value;
    mtbApiLicencias('POST', {
      accion: 'emitir',
      cliente: document.getElementById('licCliente').value.trim(),
      cuenta: document.getElementById('licCuenta').value.trim() || null,
      tipo: document.getElementById('licTipo').value,
      robot: document.getElementById('licBot').value,
      vigencia_dias: venc ? Number(venc) : null
    }).then(function(r) {
      document.getElementById('generatedTokenCode').textContent = r.token;
      document.getElementById('licenciaResultado').classList.remove('hidden');
      document.getElementById('formNuevaLicencia').classList.add('hidden');
    }).catch(function(ex) {
      err.textContent = ex.message;
      err.classList.remove('hidden');
    }).then(function() { btn.disabled = false; });
  });
}

/* Operacion en vivo de las cuentas demo del Master Trader: /api/v1/master/trading (api/master_trading.py).
   Antes vivia en el Resumen del panel de alumnos; aqui solo la ve quien tiene la clave de administrador. */
window.mtbOperacion = { datos: null, cuenta: 'todas', pagina: 1 };

function mtbCargarOperacion() {
  var cont = document.getElementById('mtbOperacion');
  if (!cont) return;
  cont.innerHTML = '<div class="text-slate-400 text-sm">Cargando operación en vivo...</div>';
  fetch('/api/v1/master/trading', { headers: { 'X-Admin-Key': mtbAdminKey() } })
    .then(function(r) {
      return r.json().catch(function() { return {}; }).then(function(j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    })
    .then(function(d) { window.mtbOperacion.datos = d; mtbRenderOperacion(); })
    .catch(function(e) {
      cont.innerHTML = '<div class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm">No se pudo cargar la operación en vivo: ' + mtbEsc(e.message) +
        '</div><button type="button" class="mtb-btn mt-3 text-xs px-3 py-2 rounded-lg bg-slate-800 text-slate-200" onclick="mtbCargarOperacion()">Reintentar</button>';
    });
}

function mtbRenderOperacion() {
  var cont = document.getElementById('mtbOperacion');
  var d = window.mtbOperacion.datos;
  if (!cont || !d) return;
  var sel = window.mtbOperacion.cuenta;
  var cuentas = d.cuentas || [];
  var nombres = {};
  cuentas.forEach(function(c) { nombres[c.login] = c.nombre; });
  var deCuenta = function(x) { return sel === 'todas' || String(x.login) === sel; };
  var pos = (d.posiciones_abiertas || []).filter(deCuenta);
  var hist = (d.historial || []).filter(deCuenta);
  var pl = hist.reduce(function(s, h) { return s + (Number(h.profit_usd) || 0); }, 0);
  var ganadoras = hist.filter(function(h) { return Number(h.profit_usd) > 0; }).length;
  var dinero = function(n) { return (n < 0 ? '-$' : '+$') + Math.abs(n).toFixed(2); };
  var color = function(n) { return n > 0 ? 'text-emerald-400' : (n < 0 ? 'text-rose-400' : 'text-slate-300'); };
  var dir = function(x) {
    return String(x || '').toUpperCase() === 'BUY'
      ? '<span class="px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 font-bold">BUY</span>'
      : '<span class="px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-400 font-bold">SELL</span>';
  };
  var cuentaTxt = function(login) { return mtbEsc((nombres[login] || 'Cuenta') + ' · #' + login); };
  var chip = function(valor, texto) {
    var act = sel === valor;
    return '<button type="button" data-op-cuenta="' + mtbEsc(valor) + '" class="mtb-btn px-2.5 py-1 rounded-full border text-xs font-mono ' +
      (act ? 'bg-sky-600 text-white border-sky-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:border-slate-500') + '">' + texto + '</button>';
  };
  var porPag = 10;
  var totPag = Math.max(1, Math.ceil(hist.length / porPag));
  var pag = Math.min(window.mtbOperacion.pagina, totPag);
  var histPag = hist.slice((pag - 1) * porPag, pag * porPag);
  var tabla = function(cab, filas) {
    return '<div class="overflow-x-auto"><table class="w-full text-xs text-left text-slate-300"><thead class="text-[11px] uppercase bg-slate-800/80 text-slate-400"><tr>' +
      cab.map(function(c) { return '<th class="p-2.5' + (c.der ? ' text-right' : '') + '">' + c.t + '</th>'; }).join('') +
      '</tr></thead><tbody class="divide-y divide-slate-800">' + filas.join('') + '</tbody></table></div>';
  };

  var html = [
    '<div class="mb-4 flex flex-wrap items-end justify-between gap-3">',
      '<div><span class="ag-eyebrow">CUENTAS DEMO DEL MASTER TRADER</span>',
      '<h2 class="text-xl font-black text-white">Operación en vivo</h2>',
      '<p class="text-[11px] text-slate-400 mt-1">Datos del coordinador del VPS en Postgres. Actualizado ' + mtbFecha(d.actualizado_en) + '.</p></div>',
      '<button type="button" class="mtb-btn text-xs px-3 py-2 rounded-lg bg-slate-800 text-slate-200" onclick="mtbCargarOperacion()">Actualizar</button>',
    '</div>',
    '<div class="flex flex-wrap gap-1.5 mb-4">', chip('todas', 'Todas (' + cuentas.length + ')'),
      cuentas.map(function(c) { return chip(String(c.login), mtbEsc(c.nombre) + ' · #' + mtbEsc(c.login)); }).join(''), '</div>',
    '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">',
      '<div class="p-4 rounded-2xl bg-slate-900/90 border border-slate-800/80"><div class="text-slate-400 text-xs mb-1">Posiciones abiertas</div><div class="text-xl font-extrabold text-white">' + pos.length + '</div></div>',
      '<div class="p-4 rounded-2xl bg-slate-900/90 border border-slate-800/80"><div class="text-slate-400 text-xs mb-1">P&amp;L de las últimas ' + hist.length + ' cerradas</div><div class="text-xl font-extrabold font-mono ' + color(pl) + '">' + dinero(pl) + '</div></div>',
      '<div class="p-4 rounded-2xl bg-slate-900/90 border border-slate-800/80"><div class="text-slate-400 text-xs mb-1">Ganadoras / perdedoras</div><div class="text-xl font-extrabold text-white">' + ganadoras + ' / ' + (hist.length - ganadoras) + '</div></div>',
    '</div>',
    '<div class="p-4 rounded-2xl bg-slate-900/90 border border-slate-800/80 mb-4"><h3 class="font-extrabold text-white text-sm mb-3">Posiciones abiertas (' + pos.length + ')</h3>',
      pos.length ? tabla([{ t: 'Cuenta' }, { t: 'Símbolo' }, { t: 'Dirección' }, { t: 'Lotes', der: 1 }, { t: 'Entrada', der: 1 }, { t: 'Temporalidad' }, { t: 'Abierta' }],
        pos.map(function(p) {
          return '<tr><td class="p-2.5">' + cuentaTxt(p.login) + '</td><td class="p-2.5 font-bold text-white">' + mtbEsc(p.simbolo) + '</td><td class="p-2.5">' + dir(p.direccion) +
            '</td><td class="p-2.5 text-right font-mono">' + mtbEsc(p.lotes) + '</td><td class="p-2.5 text-right font-mono">' + mtbEsc(p.precio_entrada) +
            '</td><td class="p-2.5">' + mtbEsc(p.temporalidad) + '</td><td class="p-2.5">' + mtbFecha(p.abierta_en) + '</td></tr>';
        })) : '<p class="text-xs text-slate-500 py-3 text-center">No hay posiciones abiertas.</p>',
    '</div>',
    '<div class="p-4 rounded-2xl bg-slate-900/90 border border-slate-800/80"><div class="flex items-center justify-between mb-3"><h3 class="font-extrabold text-white text-sm">Operaciones cerradas (' + hist.length + ')</h3>',
      '<span class="text-xs text-slate-400">Página ' + pag + ' de ' + totPag + '</span></div>',
      hist.length ? tabla([{ t: 'Cuenta' }, { t: 'Símbolo' }, { t: 'Dirección' }, { t: 'Lotes', der: 1 }, { t: 'P&amp;L', der: 1 }, { t: 'Cierre' }, { t: 'Cerrada' }],
        histPag.map(function(h) {
          var p = Number(h.profit_usd) || 0;
          return '<tr><td class="p-2.5">' + cuentaTxt(h.login) + '</td><td class="p-2.5 font-bold text-white">' + mtbEsc(h.simbolo) + '</td><td class="p-2.5">' + dir(h.direccion) +
            '</td><td class="p-2.5 text-right font-mono">' + mtbEsc(h.lotes) + '</td><td class="p-2.5 text-right font-mono font-bold ' + color(p) + '">' + dinero(p) +
            '</td><td class="p-2.5">' + mtbEsc(h.razon_cierre) + '</td><td class="p-2.5">' + mtbFecha(h.cerrada_en) + '</td></tr>';
        })) : '<p class="text-xs text-slate-500 py-3 text-center">Sin operaciones cerradas.</p>',
      totPag > 1 ? '<div class="flex items-center justify-center gap-3 mt-4">' +
        '<button type="button" data-op-pag="' + (pag - 1) + '" class="mtb-btn text-xs px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-200"' + (pag <= 1 ? ' disabled style="opacity:.4"' : '') + '>&lsaquo; Anterior</button>' +
        '<button type="button" data-op-pag="' + (pag + 1) + '" class="mtb-btn text-xs px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-200"' + (pag >= totPag ? ' disabled style="opacity:.4"' : '') + '>Siguiente &rsaquo;</button></div>' : '',
    '</div>'
  ].join('');
  cont.innerHTML = html;
  cont.querySelectorAll('[data-op-cuenta]').forEach(function(b) {
    b.addEventListener('click', function() { window.mtbOperacion.cuenta = b.getAttribute('data-op-cuenta'); window.mtbOperacion.pagina = 1; mtbRenderOperacion(); });
  });
  cont.querySelectorAll('[data-op-pag]').forEach(function(b) {
    b.addEventListener('click', function() { window.mtbOperacion.pagina = Number(b.getAttribute('data-op-pag')); mtbRenderOperacion(); });
  });
}

window.renderMasterTraderPanel();
</script>
