<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Nueva contrasena - MexTradeBot</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Lexend',sans-serif;background:#f8fafc}.mtb-btn{transition:transform 160ms ease-out}.mtb-btn:active{transform:scale(0.97)}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center bg-white rounded-2xl mb-3 px-4 py-2"><img src="/img/logo-mtb.png" alt="MexTradeBot" width="200" height="117" style="height:auto"></div>
    <h1 class="text-2xl font-extrabold text-slate-800">Crea tu contrasena nueva</h1>
    <p class="text-slate-500 text-sm mt-1">Panel de Alumnos MexTradeBot</p>
  </div>
  <form id="f" class="bg-white rounded-2xl shadow-xl p-6 space-y-4">
    <div>
      <label for="p1" class="text-sm font-semibold text-slate-700">Contrasena nueva</label>
      <input id="p1" type="password" required minlength="8" autocomplete="new-password" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
      <p class="text-xs text-slate-400 mt-1">Minimo 8 caracteres.</p>
    </div>
    <div>
      <label for="p2" class="text-sm font-semibold text-slate-700">Repite la contrasena</label>
      <input id="p2" type="password" required minlength="8" autocomplete="new-password" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <button id="b" type="submit" class="mtb-btn w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition">Guardar contrasena</button>
    <p id="m" class="text-red-600 text-sm font-semibold hidden bg-red-50 p-2.5 rounded-lg border border-red-200 text-center" role="alert"></p>
  </form>
  <p class="text-center text-sm text-slate-500 mt-4"><a href="/alumnos" class="text-green-600 font-semibold underline">Volver al panel</a></p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), token = q.get('token') || '';
  var f = document.getElementById('f'), m = document.getElementById('m'), b = document.getElementById('b');
  function error(t) { m.textContent = t; m.classList.remove('hidden'); }
  if (!token || q.get('error') === 'enlace_invalido') {
    f.classList.add('hidden');
    var aviso = document.createElement('p');
    aviso.className = 'bg-white rounded-2xl shadow-xl p-6 text-center text-slate-700';
    aviso.innerHTML = 'Este enlace ya no sirve (vence a la hora o solo se usa una vez). Pide uno nuevo desde <a class="text-green-600 font-semibold underline" href="/alumnos">el panel</a> con &laquo;Olvidaste tu contrasena?&raquo;.';
    f.parentNode.insertBefore(aviso, f);
    return;
  }
  if (q.get('error') === 'contrasena_corta') error('La contrasena debe tener al menos 8 caracteres.');
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    m.classList.add('hidden');
    var a = document.getElementById('p1').value, c = document.getElementById('p2').value;
    if (a.length < 8) { error('La contrasena debe tener al menos 8 caracteres.'); return; }
    if (a !== c) { error('Las dos contrasenas no coinciden.'); return; }
    b.disabled = true; b.textContent = 'Guardando...';
    var p = new URLSearchParams(); p.append('token', token); p.append('password', a);
    fetch('/webhook/panel-alumnos-restablecer', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: p, redirect: 'follow' })
      .then(function (r) {
        if ((r.url || '').indexOf('aviso=contrasena_actualizada') !== -1) { location.href = r.url; return; }
        if ((r.url || '').indexOf('enlace_invalido') !== -1) { location.href = '/restablecer?error=enlace_invalido'; return; }
        throw new Error('respuesta inesperada');
      })
      .catch(function () { error('No pudimos guardar la contrasena. Intenta de nuevo.'); b.disabled = false; b.textContent = 'Guardar contrasena'; });
  });
})();
</script>
</body>
</html>
