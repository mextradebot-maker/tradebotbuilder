<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Confirmaciones del Master Trader</title>
<style>
:root{--bg:#0b1320;--panel:#111c2e;--raised:#162338;--line:#243550;--text:#e6edf6;--muted:#9fb0c7;--accent:#2dd4bf;--ink:#06242c;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--ease:cubic-bezier(.23,1,.32,1)}
@media (prefers-color-scheme:light){:root{--bg:#f3f6fb;--panel:#fff;--raised:#eef3fa;--line:#cfd9e8;--text:#0f1b2d;--muted:#4a5d78;--accent:#0f766e;--ink:#fff;--ok:#047857;--warn:#92400e;--bad:#b91c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:12px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}
.estado{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--raised)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ok .dot{background:var(--ok)}.bad .dot{background:var(--bad)}.warn .dot{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:720px}
th{color:var(--muted);font-weight:600;text-align:left;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right}
.vacio{color:var(--muted);padding:12px 4px}
button,input{font:inherit;color:inherit}
button{min-height:44px;min-width:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--raised);cursor:pointer;touch-action:manipulation;transition:transform 140ms var(--ease),background-color 140ms var(--ease),border-color 140ms var(--ease)}
button:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){button:hover{border-color:var(--accent)}}
button.primario{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}
button.peligro{border-color:var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.5;cursor:not-allowed}
.acciones{display:flex;gap:6px;flex-wrap:wrap}
.acciones button{min-height:36px;padding:0 10px;font-size:13px}
input,select{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--raised);width:min(360px,100%);font:inherit;color:inherit}
.filtros{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.filtros input,.filtros select{width:170px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.clave{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.msg{min-height:22px;margin:8px 0 0;font-size:13px;color:var(--muted)}
.msg.err{color:var(--bad)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
  <script src="/master-menu.js"></script>
  <header><h1>Confirmaciones del alumno</h1></header>
  <section id="acceso">
    <h2>Acceso de administrador</h2>
    <form class="clave" id="f">
      <div><label for="k">Clave de administrador</label><input id="k" type="password" autocomplete="off" spellcheck="false"></div>
      <button class="primario" type="submit">Entrar</button>
    </form>
    <p class="msg" id="m" role="status"></p>
  </section>
  <section id="auts" hidden>
    <h2>Confirmaciones del alumno</h2>
    <form class="filtros" id="fa">
      <div><label for="fd">Desde</label><input id="fd" type="date"></div>
      <div><label for="fh">Hasta</label><input id="fh" type="date"></div>
      <div><label for="fu">Usuario (correo)</label><input id="fu" autocomplete="off" spellcheck="false"></div>
      <div><label for="fn">Nombre (alumno o robot)</label><input id="fn" autocomplete="off"></div>
      <div><label for="fs">Activo</label><input id="fs" placeholder="GOLD, EURUSD..." autocomplete="off" spellcheck="false"></div>
      <div><label for="fe">Respuesta</label><select id="fe"><option value="">Todas</option><option value="aceptada">Aceptada</option><option value="rechazada">Rechazada</option><option value="solicitada">Solo solicitadas</option></select></div>
      <button class="primario" type="submit">Buscar</button>
    </form>
    <p class="msg" id="ma" role="status"></p>
    <table>
      <thead><tr><th>Hora (UTC)</th><th>Respuesta</th><th>Alumno</th><th>Correo</th><th>Robot</th><th>Activo</th><th>Cuenta</th><th>Chat</th><th>Huella del texto</th><th>IP</th></tr></thead>
      <tbody id="ta"></tbody>
    </table>
  </section>

</main>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let clave='';try{clave=sessionStorage.getItem('mtb_admin')||''}catch(e){}
  const pill=(t,c)=>`<span class="pill ${c}"><span class="dot"></span>${esc(t)}</span>`;
  // buscador de confirmaciones: no se refresca solo, para no borrar lo que el administrador esta revisando
  async function buscar(){
    const q=new URLSearchParams();
    for(const [k,i] of [['desde','fd'],['hasta','fh'],['usuario','fu'],['nombre','fn'],['activo','fs'],['evento','fe']])if($(i).value.trim())q.set(k,$(i).value.trim());
    const r=await fetch('/api/v1/master/autorizaciones?'+q,{headers:{'X-Admin-Key':clave}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){$('ma').textContent=d.error||('Error '+r.status);$('ma').className='msg err';return}
    $('ma').textContent=d.total+(d.total===1?' registro':' registros')+(d.total>=100?' (los 100 mas recientes; afina los filtros)':'');$('ma').className='msg';
    $('ta').innerHTML=(d.autorizaciones||[]).map(a=>`<tr><td class="mono">${esc(String(a.registrada_en||'').slice(0,19).replace('T',' '))}</td>
      <td>${pill(a.evento,a.evento==='aceptada'?'ok':a.evento==='rechazada'?'bad':'warn')}</td><td>${esc(a.alumno||'-')}</td><td class="mono">${esc(a.correo||'-')}</td>
      <td>${esc(a.robot||('Licencia '+a.licencia_id))}</td><td>${esc(a.simbolo)} ${esc(a.temporalidad)}</td><td class="mono">${esc(a.cuenta??'-')}</td>
      <td class="mono">${esc(a.chat_id??'-')}</td><td class="mono">${esc(a.texto_huella||'-')}</td><td class="mono">${esc(a.ip||'-')}</td></tr>`).join('')||'<tr><td colspan="10" class="vacio">Sin resultados con esos filtros.</td></tr>';
  }
  async function entrar(){
    const r=await fetch('/api/v1/master/autorizaciones?limite=1',{headers:{'X-Admin-Key':clave}});
    if(r.status===401){$('m').textContent='Clave incorrecta.';$('m').className='msg err';$('auts').hidden=true;$('acceso').hidden=false;return}
    $('acceso').hidden=true;$('auts').hidden=false;buscar();
  }
  $('fa').addEventListener('submit',e=>{e.preventDefault();buscar()});
  $('f').addEventListener('submit',e=>{e.preventDefault();clave=$('k').value.trim();try{sessionStorage.setItem('mtb_admin',clave)}catch(x){}entrar()});
  if(clave)entrar();
})();
</script>
</body>
</html>
