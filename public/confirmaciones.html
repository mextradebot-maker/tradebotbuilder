<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Confirmaciones del Master Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/master-tema.css">
<link rel="icon" type="image/png" href="/img/favicon-32.png">
</head>
<body>
<main>
  <script src="/master-menu.js"></script>
  <header><h1>Confirmaciones del alumno</h1></header>
  <section id="acceso">
    <h2>Acceso de administrador</h2>
    <form class="clave" id="f">
      <div><label for="k">Clave de administrador</label><input id="k" type="password" autocomplete="off" spellcheck="false"></div>
      <button class="primario" type="submit">Entrar</button>
    </form>
    <p class="msg" id="m" role="status"></p>
  </section>
  <section id="auts" hidden>
    <h2>Confirmaciones del alumno</h2>
    <form class="filtros" id="fa">
      <div><label for="fd">Desde</label><input id="fd" type="date"></div>
      <div><label for="fh">Hasta</label><input id="fh" type="date"></div>
      <div><label for="fu">Usuario (correo)</label><input id="fu" autocomplete="off" spellcheck="false"></div>
      <div><label for="fn">Nombre (alumno o robot)</label><input id="fn" autocomplete="off"></div>
      <div><label for="fs">Activo</label><input id="fs" placeholder="GOLD, EURUSD..." autocomplete="off" spellcheck="false"></div>
      <div><label for="fe">Respuesta</label><select id="fe"><option value="">Todas</option><option value="aceptada">Aceptada</option><option value="rechazada">Rechazada</option><option value="solicitada">Solo solicitadas</option></select></div>
      <button class="primario" type="submit">Buscar</button>
    </form>
    <p class="msg" id="ma" role="status"></p>
    <table>
      <thead><tr><th>Hora (UTC)</th><th>Respuesta</th><th>Alumno</th><th>Correo</th><th>Robot</th><th>Activo</th><th>Cuenta</th><th>Chat</th><th>Huella del texto</th><th>IP</th></tr></thead>
      <tbody id="ta"></tbody>
    </table>
  </section>

</main>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let clave='';try{clave=sessionStorage.getItem('mtb_admin')||''}catch(e){}
  const pill=(t,c)=>`<span class="pill ${c}"><span class="dot"></span>${esc(t)}</span>`;
  // buscador de confirmaciones: no se refresca solo, para no borrar lo que el administrador esta revisando
  async function buscar(){
    const q=new URLSearchParams();
    for(const [k,i] of [['desde','fd'],['hasta','fh'],['usuario','fu'],['nombre','fn'],['activo','fs'],['evento','fe']])if($(i).value.trim())q.set(k,$(i).value.trim());
    const r=await fetch('/api/v1/master/autorizaciones?'+q,{headers:{'X-Admin-Key':clave}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){$('ma').textContent=d.error||('Error '+r.status);$('ma').className='msg err';return}
    $('ma').textContent=d.total+(d.total===1?' registro':' registros')+(d.total>=100?' (los 100 mas recientes; afina los filtros)':'');$('ma').className='msg';
    $('ta').innerHTML=(d.autorizaciones||[]).map(a=>`<tr><td class="mono">${esc(String(a.registrada_en||'').slice(0,19).replace('T',' '))}</td>
      <td>${pill(a.evento,a.evento==='aceptada'?'ok':a.evento==='rechazada'?'bad':'warn')}</td><td>${esc(a.alumno||'-')}</td><td class="mono">${esc(a.correo||'-')}</td>
      <td>${esc(a.robot||('Licencia '+a.licencia_id))}</td><td>${esc(a.simbolo)} ${esc(a.temporalidad)}</td><td class="mono">${esc(a.cuenta??'-')}</td>
      <td class="mono">${esc(a.chat_id??'-')}</td><td class="mono">${esc(a.texto_huella||'-')}</td><td class="mono">${esc(a.ip||'-')}</td></tr>`).join('')||'<tr><td colspan="10" class="vacio">Sin resultados con esos filtros.</td></tr>';
  }
  async function entrar(){
    const r=await fetch('/api/v1/master/autorizaciones?limite=1',{headers:{'X-Admin-Key':clave}});
    if(r.status===401){$('m').textContent='Clave incorrecta.';$('m').className='msg err';$('auts').hidden=true;$('acceso').hidden=false;return}
    $('acceso').hidden=true;$('auts').hidden=false;buscar();
  }
  $('fa').addEventListener('submit',e=>{e.preventDefault();buscar()});
  $('f').addEventListener('submit',e=>{e.preventDefault();clave=$('k').value.trim();try{sessionStorage.setItem('mtb_admin',clave)}catch(x){}entrar()});
  if(clave)entrar();
})();
</script>
</body>
</html>
